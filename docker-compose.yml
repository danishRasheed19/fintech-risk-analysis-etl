services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-analytics-backend
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RISK_API_URL: http://localhost:8000
    container_name: risk-analytics-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
