services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-analytics-backend
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RISK_API_URL: http://localhost:8000
    container_name: risk-analytics-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped


  airflow-db:
    image: postgres:16
    container_name: risk-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_dev
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_dev@airflow-db:5432/airflow
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      PYTHONPATH: /opt/project:/opt/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./data:/opt/project/data
      - ./reports:/opt/project/reports
      - ./sql:/opt/project/sql
    depends_on:
      airflow-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --username airflow --password airflow --firstname Local --lastname Admin --role Admin --email airflow@example.com
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: risk-airflow-webserver
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_dev@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__WORKERS: "1"
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      PYTHONPATH: /opt/project:/opt/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./data:/opt/project/data
      - ./reports:/opt/project/reports
      - ./sql:/opt/project/sql
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: risk-airflow-scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_dev@airflow-db:5432/airflow
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      PYTHONPATH: /opt/project:/opt/project/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./data:/opt/project/data
      - ./reports:/opt/project/reports
      - ./sql:/opt/project/sql
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs:

